site_name: PanoReady
site_description: Browser-based validation, repair, and comparison workflows for STIX school enrolment data.
site_url: https://wdgph.github.io/PanoReady/docs/
repo_url: https://github.com/WDGPH/PanoReady
repo_name: WDGPH/PanoReady
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Wellington-Dufferin-Guelph Public Health

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Workflows:
      - Validate & Fix: workflow-validate-and-fix.md
      - Compare Files: workflow-compare-files.md
  - Configuration:
      - Rulesets: rulesets.md
      - Validation rules: validation-rules.md
  - Technical reference:
      - Data model: data-model.md
      - System design: system-design-panoready.md
      - Canonical runtime: canonical-runtime.md
      - Proposed import contracts: canonical-import-contracts.md
      - Development: development.md
      - Deployment: deployment.md
      - Release checklist: releasing.md
  - Project policies: project-policies.md

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

# Local workbook analysis may exist in developer checkouts; never publish it.
exclude_docs: |
  /official-template-internals.md
