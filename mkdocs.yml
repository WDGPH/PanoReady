site_name: PanoReady
site_description: Browser-based validation, repair, and comparison workflows for STIX school enrolment data.
site_url: https://docs.phiz.ca/panoready/latest/
repo_url: https://github.com/WDGPH/PanoReady
repo_name: WDGPH/PanoReady
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Wellington-Dufferin-Guelph Public Health

theme:
  name: material

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Workflows:
      - Validate & Fix: workflow-validate-and-fix.md
      - Compare Files: workflow-compare-files.md
  - Configuration:
      - Rulesets: rulesets.md
      - Validation rules: validation-rules.md
  - Technical reference:
      - Data model: data-model.md
      - System design: system-design-panoready.md
      - Architecture diagrams: architecture-diagrams.md
      - Canonical runtime: canonical-runtime.md
      - Proposed import contracts: canonical-import-contracts.md
      - Autofix sequencing: autofix-sequencing.md
      - Development: development.md
      - Deployment: deployment.md
      - Release checklist: releasing.md
  - Project policies: project-policies.md

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

# Private reference material may exist in developer checkouts; never publish it.
exclude_docs: |
  /official-template-internals.md
  /private/
  /internal/
