name: Feature request
description: Suggest a focused improvement to PanoReady.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed outcome
      description: Describe the desired behaviour without sensitive examples.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included real student records, personal information, credentials, or other sensitive data.
          required: true
