name: Browser privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-privacy:
    name: Production workflows and privacy guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
