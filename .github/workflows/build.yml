name: Clean install and build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Install, lint, build, and start
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint project
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Smoke-test production server
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Production server did not become ready within 30 seconds."
          exit 1
